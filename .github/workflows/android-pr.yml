name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/windows-lan-client
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Run unit tests and build installable APK
        run: ./gradlew testOssDebugUnitTest assembleOssDebug --stacktrace

      - name: Upload universal debug APK
        uses: actions/upload-artifact@v7
        with:
          name: roundsync-shizuku-universal-debug
          path: app/build/outputs/apk/oss/debug/*-oss-universal-debug.apk
          if-no-files-found: error
          retention-days: 30
